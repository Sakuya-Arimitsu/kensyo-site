name: 確認用ページを更新

# main 以外のブランチ（Claudeが作った下書き）に保存されたら、
# 確認用フォルダ（kensyo-preview）にアップロードします。
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのファイルを取り出す
        uses: actions/checkout@v4

      - name: Pythonを準備する
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 必要な部品をインストールする
        run: pip install -r requirements.txt

      - name: 確認用ページを生成する
        run: python build.py --preview

      - name: 確認用フォルダにアップロードする
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./hisazumi-test.com/public_html/kensyo-preview/

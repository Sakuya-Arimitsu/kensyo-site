name: 公開申請を自動で作る

# Claude が下書き（claude/ で始まるブランチ）を保存したら、
# 公開申請（プルリクエスト）を作り、元のIssueにリンクを知らせます。
# 2回目以降の保存（公開申請がすでにある場合）は何もしません。
on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PREVIEW_URL: https://hisazumi-test.com/kensyo-preview/

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのファイルを取り出す
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 公開申請を作る
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "公開申請 #$EXISTING がすでにあります。"
            exit 0
          fi

          git fetch origin main
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          if [ -z "$CHANGED" ]; then
            echo "main との違いがないため、公開申請は作りません。"
            exit 0
          fi

          ISSUE_NUMBER="$(echo "$BRANCH" | sed -nE 's#^claude/issue-([0-9]+)-.*#\1#p')"
          SUMMARY=""
          if [ -n "$ISSUE_NUMBER" ]; then
            # Issueのタイトルから「@claude」を取り除いて使う
            SUMMARY="$(gh issue view "$ISSUE_NUMBER" --json title --jq .title | sed -E 's/@claude//g; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          fi
          if [ -z "$SUMMARY" ]; then
            SUMMARY="$(git log -1 --pretty=%s)"
          fi
          TITLE="公開申請: $SUMMARY"

          echo "$CHANGED" | ISSUE_NUMBER="$ISSUE_NUMBER" python3 .github/scripts/make_pr_body.py > pr-body.md
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md)"
          echo "公開申請を作りました: $PR_URL"

          if [ -n "$ISSUE_NUMBER" ]; then
            {
              echo "### 公開申請を作りました"
              echo ""
              echo "**→ $PR_URL**"
              echo ""
              echo "1〜2分後に、確認用ページ（$PREVIEW_URL）で見た目を確認できます。"
              echo "内容の修正や公開は、上の公開申請のページで行ってください。"
            } > issue-comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file issue-comment.md
          fi
